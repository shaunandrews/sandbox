<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SnappPress</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="settings-icon">⚙️</div>
    <div class="container">
      <div class="panel" id="empty-panel">
        <button id="take-screenshot" class="take-screenshot-btn">Take Screenshot</button>
        <p class="panel-subtitle">or use the hotkey <span class="hotkey">⌘⇧4</span></p>
      </div>
      <div class="panel" id="uploaded-panel" style="display: none;">
        <div id="screenshot-preview"></div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
