<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SnapPress Settings</title>
    <link rel="stylesheet" href="index.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
  </head>
  <body>
    <h1>SnapPress Settings</h1>
    <form id="settings-form">
      <label for="wordpress-url">WordPress URL:</label>
      <input type="url" id="wordpress-url" required>
      
      <label for="wordpress-username">WordPress Username:</label>
      <input type="text" id="wordpress-username" required>
      
      <label for="wordpress-password">WordPress Application Password:</label>
      <input type="password" id="wordpress-password" required>
      
      <button type="submit">Save Settings</button>
    </form>
    <script src="settings.js"></script>
  </body>
</html>
